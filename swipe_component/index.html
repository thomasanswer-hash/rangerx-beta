<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
  * { box-sizing:border-box; }
  html, body {
    margin:0;
    padding:0;
    background:transparent;
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:#F0F3F2;
    overflow:hidden;
  }
  .stage {
    position:relative;
    width:100%;
    height:444px;
    max-width:800px;
    margin:0 auto;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  .nav-row { display:flex; justify-content:center; gap:24px; padding-top:4px; }
  .nav-btn { min-width:132px; padding:9px 18px; border-radius:11px; border:1px solid #465154; background:#22292b; color:#f0f3f2; font:500 14px Montserrat,sans-serif; white-space:nowrap; cursor:pointer; }
  .nav-btn:disabled { opacity:.35; cursor:default; }
  .nav-btn:not(:disabled):hover { border-color:#5ED8CE; }
  .card {
    position:absolute;
    width:min(480px, 66vw);
    height:270px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:1px solid #354347;
    border-radius:30px;
    background:#20282B;
    box-shadow:0 14px 38px rgba(0,0,0,.22);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:22px;
    cursor:grab;
    will-change:transform,opacity;
    z-index:3;
  }
  .card.dragging {
    cursor:grabbing;
    box-shadow:0 18px 48px rgba(0,0,0,.32);
  }
  .orb {
    width:68px;
    height:68px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(94,216,206,.09);
    box-shadow:0 0 32px rgba(94,216,206,.10);
    color:#5ED8CE;
    font-size:34px;
    margin-bottom:14px;
  }
  .statement {
    max-width:390px;
    text-align:center;
    font-size:20px;
    line-height:1.35;
    font-weight:600;
    letter-spacing:-.025em;
  }
  .dir {
    position:absolute;
    z-index:2;
    border:0;
    background:transparent;
    color:#5ED8CE;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    padding:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dir:hover { color:#F0F3F2; }
  .up { top:0px; left:50%; transform:translateX(-50%); flex-direction:column; gap:2px; }
  .down { bottom:0px; left:50%; transform:translateX(-50%); flex-direction:column-reverse; gap:2px; }
  .left { left:20px; top:50%; transform:translateY(-50%); }
  .right { right:20px; top:50%; transform:translateY(-50%); }
  .arrow { font-size:26px; line-height:1; }

  .feedback {
    position:absolute;
    z-index:4;
    padding:10px 14px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    opacity:0;
    display:none;
    pointer-events:none;
    background:#20282B;
    border:1px solid #354347;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
  }
  .feedback.leftF { left:14%; top:48%; color:#5ED8CE; }
  .feedback.rightF { right:14%; top:48%; color:#5ED8CE; }
  .feedback.upF { left:50%; top:18%; transform:translateX(-50%); color:#5ED8CE; }
  .feedback.downF { left:50%; bottom:17%; transform:translateX(-50%); color:#5ED8CE; }

  @media (max-width:650px) {
    .stage {
      height:430px;
      max-width:100%;
    }
    .card {
      width:calc(100vw - 24px);
      max-width:390px;
      height:270px;
      top:37%;
      padding:22px 22px;
      border-radius:26px;
    }
    .statement {
      font-size:19px;
      line-height:1.42;
      max-width:320px;
      font-weight:500;
    }
    .orb {
      width:70px;
      height:70px;
      font-size:28px;
      margin-bottom:20px;
    }

    .dir {
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.02em;
      border:1px solid #465154;
      border-radius:15px;
      background:#20282B;
      color:#5ED8CE;
      min-height:58px;
      justify-content:center;
      padding:6px 8px;
    }
    .arrow { font-size:20px; }

    .up {
      top:auto;
      bottom:60px;
      left:50%;
      width:34%;
      transform:translateX(-50%);
      flex-direction:column;
      gap:0;
    }
    .left {
      left:0;
      top:auto;
      bottom:0;
      width:32%;
      transform:none;
      flex-direction:column;
      gap:0;
    }
    .down {
      left:34%;
      top:auto;
      bottom:0;
      width:32%;
      transform:none;
      flex-direction:column;
      gap:0;
    }
    .right {
      right:0;
      top:auto;
      bottom:0;
      width:32%;
      transform:none;
      flex-direction:column;
      gap:0;
    }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <button class="dir up" onclick="submitAnswer(2)" aria-label="Sometimes">
    <span class="arrow">▲</span><span>Sometimes</span>
  </button>
  <button class="dir left" onclick="submitAnswer(1)" aria-label="Never">
    <span class="arrow">◀</span><span>Never</span>
  </button>
  <button class="dir right" onclick="submitAnswer(4)" aria-label="Always">
    <span>Always</span><span class="arrow">▶</span>
  </button>
  <button class="dir down" onclick="submitAnswer(3)" aria-label="Often">
    <span class="arrow">▼</span><span>Often</span>
  </button>

  <div class="feedback leftF" id="leftF">Never</div>
  <div class="feedback rightF" id="rightF">Always</div>
  <div class="feedback upF" id="upF">Sometimes</div>
  <div class="feedback downF" id="downF">Often</div>

  <div class="card" id="card">
    <div class="orb" id="orb"></div>
    <div class="statement" id="statement"></div>
  </div>
</div>
<div class="nav-row" aria-label="Question navigation">
  <button class="nav-btn" id="navBack" onclick="navigate('back')">← Back</button>
  <button class="nav-btn" id="navNext" onclick="navigate('next')">Next →</button>
</div>

<script>
const Streamlit = {
  setComponentReady: function() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  },
  setFrameHeight: function(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height
    }, "*");
  },
  setComponentValue: function(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value,
      dataType: "json"
    }, "*");
  }
};

const card = document.getElementById('card');
const statementEl = document.getElementById('statement');
const orbEl = document.getElementById('orb');
const icons = {
  "Starting Off": '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.08 2.08 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6.05 11A22 22 0 0 1 12 15Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5-1 5-1M12 15v5s3.03-.55 4-2c1.08-1.62 1-5 1-5"/>',
  "Finding Out": '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
  "Meeting Needs": '<svg x="0" y="1" width="24" height="22" viewBox="0 0 576 512" fill="#5ED8CE" stroke="none"><path d="M323.4 85.2l-96.8 78.4c-16.1 13-19.2 36.4-7 53.1c12.9 17.8 38 21.3 55.3 7.8l99.3-77.2c7-5.4 17-4.2 22.5 2.8s4.2 17-2.8 22.5l-20.9 16.2L512 316.8 512 128l-.7 0-3.9-2.5L434.8 79c-15.3-9.8-33.2-15-51.4-15c-21.8 0-43 7.5-60 21.2zm22.8 124.4l-51.7 40.2C263 274.4 217.3 268 193.7 235.6c-22.2-30.5-16.6-73.1 12.7-96.8l83.2-67.3c-11.6-4.9-24.1-7.4-36.8-7.4C234 64 215.7 69.6 200 80l-72 48 0 224 28.2 0 91.4 83.4c19.6 17.9 49.9 16.5 67.8-3.1c5.5-6.1 9.2-13.2 11.1-20.6l17 15.6c19.5 17.9 49.9 16.6 67.8-2.9c4.5-4.9 7.8-10.6 9.9-16.5c19.4 13 45.8 10.3 62.1-7.5c17.9-19.5 16.6-49.9-2.9-67.8l-134.2-123zM16 128c-8.8 0-16 7.2-16 16L0 352c0 17.7 14.3 32 32 32l32 0c17.7 0 32-14.3 32-32l0-224-80 0zM48 320a16 16 0 1 1 0 32 16 16 0 1 1 0-32zM544 128l0 224c0 17.7 14.3 32 32 32l32 0c17.7 0 32-14.3 32-32l0-208c0-8.8-7.2-16-16-16l-80 0zm32 208a16 16 0 1 1 32 0 16 16 0 1 1 -32 0z"/></svg>'
};
function iconFor(stage) {
  return '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (icons[stage] || icons["Starting Off"]) + '</svg>';
}

let dragging = false;
let startX = 0;
let startY = 0;
let dx = 0;
let dy = 0;
let submitted = false;
const threshold = 110;

function render(args) {
  const statement = (args && args.statement) ? args.statement : "";
  const identity = String(args?.position ?? '') + ':' + statement;
  if (identity !== window.currentIdentity) {
    window.currentIdentity = identity;
    submitted = false;
    dragging = false;
    card.style.transition = 'none';
    card.style.transform = 'translate(-50%,-50%)';
    card.style.opacity = '1';
    card.style.visibility = 'visible';
    ['leftF','rightF','upF','downF'].forEach(id => document.getElementById(id).style.opacity = 0);
  }
  statementEl.textContent = statement;
  orbEl.innerHTML = iconFor(args?.stage || "Starting Off");
  document.getElementById('navBack').disabled = (args?.position ?? 1) <= 1;
  document.getElementById('navNext').disabled = !(args?.answered);
  Streamlit.setFrameHeight(window.innerWidth <= 650 ? 490 : 500);
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  render(data.args || {});
});

function showFeedback(x, y) {
  const ax = Math.abs(x), ay = Math.abs(y);
  ['leftF','rightF','upF','downF'].forEach(id => document.getElementById(id).style.opacity = 0);
  const strength = Math.min(1, Math.max(ax, ay) / threshold);

  if (ax > ay) {
    document.getElementById(x < 0 ? 'leftF' : 'rightF').style.opacity = strength;
  } else {
    document.getElementById(y < 0 ? 'upF' : 'downF').style.opacity = strength;
  }
}

function moveCard(x, y) {
  const rot = Math.max(-12, Math.min(12, x / 18));
  card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rot}deg)`;
  const dist = Math.hypot(x, y);
  card.style.opacity = dist > 150 ? .72 : 1;
  showFeedback(x, y);
}

function resetCard() {
  card.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease';
  card.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  card.style.opacity = 1;
  ['leftF','rightF','upF','downF'].forEach(id => document.getElementById(id).style.opacity = 0);
  setTimeout(() => { card.style.transition = ''; }, 300);
}

function navigate(direction) {
  if (submitted) return;
  submitted = true;
  document.getElementById('navBack').disabled = true;
  document.getElementById('navNext').disabled = true;
  Streamlit.setComponentValue(direction);
}

function submitAnswer(score) {
  if (submitted) return;
  submitted = true;

  let endX = 0, endY = 0;
  if (score === 1) endX = -500;
  if (score === 4) endX = 500;
  if (score === 2) endY = -500;
  if (score === 3) endY = 500;

  card.style.transition = 'transform .24s ease-out, opacity .2s ease-out';
  card.style.transform = `translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px))`;
  card.style.opacity = 0;

  // Finish the outgoing animation before notifying Streamlit.
  // Keep the old card hidden while the Python rerun mounts the next question.
  setTimeout(() => {
    card.style.visibility = 'hidden';
    Streamlit.setComponentValue(score);
  }, 245);
}

card.addEventListener('pointerdown', (e) => {
  if (submitted) return;
  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  dx = 0;
  dy = 0;
  card.classList.add('dragging');
  card.setPointerCapture(e.pointerId);
});

card.addEventListener('pointermove', (e) => {
  if (!dragging || submitted) return;
  dx = e.clientX - startX;
  dy = e.clientY - startY;
  moveCard(dx, dy);
});

card.addEventListener('pointerup', () => {
  if (!dragging || submitted) return;
  dragging = false;
  card.classList.remove('dragging');

  const ax = Math.abs(dx), ay = Math.abs(dy);

  if (ax > ay && ax >= threshold) {
    submitAnswer(dx < 0 ? 1 : 4);
  } else if (ay >= threshold) {
    submitAnswer(dy < 0 ? 2 : 3);
  } else {
    resetCard();
  }
});

card.addEventListener('pointercancel', () => {
  dragging = false;
  card.classList.remove('dragging');
  if (!submitted) resetCard();
});

Streamlit.setComponentReady();
Streamlit.setFrameHeight(window.innerWidth <= 650 ? 490 : 500);
</script>
</body>
</html>
